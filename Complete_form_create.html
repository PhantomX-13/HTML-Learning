<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> Bangladesh </title>
    </head>
    <body>
        <h1 style="text-align: center;"> Sign Up Here </h1>
        <hr>
        <br>
        <label for="user"> Name: </label>
        <input type="text" id="user" name="user" placeholder="User Name"> <br>
        <label for="email"> Email: </label>
        <input type="email" id="email" name="usermail" placeholder="User Mail" required> <br>

        <label for="pass"> Password: </label>
        <input type="password" id="pass" name="password" placeholder="Password">
        <br>
        <label for="Phone"> Phone: </label>
        <select name="code">
            <option value="+880">+880 </option>
            <option value="+990">+990 </option>
            <option value="+110">+110 </option>
        </select>
        <input type="number" id="Phone" name="Phone" placeholder="+8801XXXXXXXXX" required>
        <br>
        <label for="Country"> Country: </label>
        <input list="con">
        <datalist id="con">
            <option value="Bangladesh"></option>
            <option value="USA"></option>
            <option value="Canada"></option>
            <option value="Australia"></option>
        </datalist>
        <br>
        Gender:
        <input type="radio" id="gnd1" name="Gender">
        <label for="gnd1"> Male </label>
        <input type="radio" id="gnd2" name="Gender">
        <label for="gnd2"> Female </label>
        <br>
        <label for="date"> Date of Birth: </label>
        <input type="date" id="'date" name="dob" placeholder="mm/dd/yyyy">
        <br>
        <label for="time"> Time: </label>
        <input type="time" id="time" name="tm">
        <br>
        <label for="colors"> Colors </label>
        <input type="color" id="colors" name="col">
        <br>
        <label for="file"> Choose Photo:  </label>
        <input type="file" id="file" name="fl">
        <br>
        <input type="checkbox" id="vehicle1" name="vec">
        <label for="vehicle1"> I have a Bike </label>
        <input type="checkbox" id="vehicle2" name="vec">
        <label for="vehicle2"> I have a Bicycle </label>
        <br>
        <textarea name="comment" cols="30" rows="10"> Comment Here </textarea>
        <br>
        <input type="submit" value="Send">
        <input type="reset" value="reset">




    </body>
    </html>
